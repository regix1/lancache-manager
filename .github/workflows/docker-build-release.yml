name: Docker Build and Push (Release)

on:
  workflow_run:
    workflows: ["Create Release"]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  check-trigger:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      release-tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check if workflow should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Manually triggered"
          elif [[ "${{ github.event_name }}" == "workflow_run" && "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Triggered by successful Create Release workflow"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Conditions not met. Event: ${{ github.event_name }}, Conclusion: ${{ github.event.workflow_run.conclusion }}"
          fi

      # The release tags point at whatever this workflow builds, so it must build the released
      # commit. Building the branch head republishes :latest, :release and :X.Y.Z from unreleased work.
      - name: Resolve the release tag to build
        id: release
        if: ${{ steps.check.outputs.should-run == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No published release found, so there is no tag to build from. Run Create Release first."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building from release tag $TAG"

  build-and-push:
    needs: check-trigger
    if: ${{ needs.check-trigger.outputs.should-run == 'true' }}
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            variant: full
            install_postgres: "true"
          - platform: linux/amd64
            runner: ubuntu-latest
            variant: slim
            install_postgres: "false"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            variant: full
            install_postgres: "true"
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            variant: slim
            install_postgres: "false"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Debug workflow trigger
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow run event: ${{ github.event.workflow_run.event }}"
          echo "Workflow run name: ${{ github.event.workflow_run.name }}"
          echo "Variant: ${{ matrix.variant }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.check-trigger.outputs.release-tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        timeout-minutes: 5
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Docker authentication
        run: |
          echo "Verifying Docker authentication..."
          docker info | grep -i username || echo "Not logged in via docker info"
          cat ~/.docker/config.json | jq -r '.auths | keys[]' || echo "No auth configured"

      - name: Read VERSION file
        id: version
        # A stray carriage return would end the first build-arg line early and swallow the rest
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> $GITHUB_OUTPUT

      - name: Prepare image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Compute variant tag suffix
        id: variant
        run: |
          if [ "${{ matrix.variant }}" = "slim" ]; then
            echo "tag_suffix=-slim" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest${{ steps.variant.outputs.tag_suffix }}
            type=raw,value=release${{ steps.variant.outputs.tag_suffix }}
            type=raw,value=${{ steps.version.outputs.VERSION }}${{ steps.variant.outputs.tag_suffix }}
          flavor: |
            suffix=-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        timeout-minutes: 60
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
            INSTALL_POSTGRES=${{ matrix.install_postgres }}
            IMAGE_VARIANT=${{ matrix.variant }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:cache-${{ matrix.variant }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:cache-${{ matrix.variant }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max
          provenance: false

      # The build step pushes without loading, so the image has to come back from the registry.
      # Each matrix leg runs on a native runner for its own platform, so this pulls its own arch.
      # The pg_ctl probe is the same one entrypoint.sh uses to decide whether embedded mode can run.
      - name: Verify the image matches its variant
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          TAG=$(echo "$TAGS" | head -n 1)
          echo "Checking $TAG"
          docker pull "$TAG"
          if docker run --rm --entrypoint sh "$TAG" -c 'ls /usr/lib/postgresql/*/bin/pg_ctl' > /dev/null 2>&1; then
            FOUND=true
          else
            FOUND=false
          fi
          echo "variant=${{ matrix.variant }} expected pg_ctl present=${{ matrix.install_postgres }}, found=$FOUND"
          if [ "$FOUND" != "${{ matrix.install_postgres }}" ]; then
            echo "The ${{ matrix.variant }} image is wrong: pg_ctl present=$FOUND but INSTALL_POSTGRES=${{ matrix.install_postgres }}."
            exit 1
          fi

  create-manifest:
    needs: [check-trigger, build-and-push]
    # Only run if check passed and build succeeded
    if: ${{ needs.check-trigger.outputs.should-run == 'true' && success() }}
    strategy:
      matrix:
        variant: [full, slim]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.check-trigger.outputs.release-tag }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        timeout-minutes: 5
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file
        id: version
        # A stray carriage return would end the first build-arg line early and swallow the rest
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> $GITHUB_OUTPUT

      - name: Prepare image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Compute variant tag suffix
        id: variant
        run: |
          if [ "${{ matrix.variant }}" = "slim" ]; then
            echo "tag_suffix=-slim" >> $GITHUB_OUTPUT
          else
            echo "tag_suffix=" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest${{ steps.variant.outputs.tag_suffix }}
            type=raw,value=release${{ steps.variant.outputs.tag_suffix }}
            type=raw,value=${{ steps.version.outputs.VERSION }}${{ steps.variant.outputs.tag_suffix }}

      - name: Create and push multi-arch manifest
        env:
          TAGS: ${{ steps.meta.outputs.json }}
        run: |
          echo "$TAGS" | jq -r '.tags[]' | while IFS= read -r tag; do
            echo "Creating manifest for: $tag"
            docker buildx imagetools create -t ${tag} \
              ${tag}-amd64 \
              ${tag}-arm64
          done
