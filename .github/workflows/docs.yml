name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs-site/**
      - docs/images/**
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - docs-site/**
      - docs/images/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt

      - run: pip install -r docs-site/requirements.txt

      - name: Stage docs from docs-site/content
        run: python docs-site/build.py

      # --strict fails the build on any broken link or missing anchor.
      - name: Build site
        run: mkdocs build --strict -f docs-site/generated/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/generated/site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
