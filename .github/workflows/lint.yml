name: Lint

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run knip
      - run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # The authorization suite boots the real app through WebApplicationFactory, which runs as
    # Development and so takes its connection string from appsettings.Development.json. The
    # credentials below are not a free choice: they are the lancache/lancache pair that file
    # names, on the TCP port it names. The suite then creates its own database, which the
    # image's POSTGRES_USER can do because that account is a superuser.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lancache
          POSTGRES_PASSWORD: lancache
        ports:
          - 5432:5432
        # Over TCP, not the socket: during initialization the image runs a temporary server
        # that listens on the socket only, so a socket probe reports ready before the port
        # the tests connect to is open.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lancache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore lancache-manager.sln

      # --no-incremental is not optional: an incremental build re-emits zero analyzer
      # warnings, so a cached or partial build would report clean while CA/xUnit rules
      # still fire. Analyzer severities live in .editorconfig and the two
      # Directory.Build.props files, which already promote them to errors.
      - name: Build with analyzer and nullable warnings as errors
        run: >
          dotnet build lancache-manager.sln
          --no-restore
          --no-incremental
          -p:SkipRustBuild=true
          -warnaserror:CS8600,CS8601,CS8602,CS8603,CS8604

      - name: Run backend tests
        run: dotnet test lancache-manager.sln --no-restore -p:SkipRustBuild=true

  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-processor

    # Same credentials as the backend job above: db.rs defaults to the lancache/lancache
    # pair when no DATABASE_URL is set, and the test step below points at this service
    # using that same pair.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lancache
          POSTGRES_PASSWORD: lancache
        ports:
          - 5432:5432
        # Over TCP, not the socket: during initialization the image runs a temporary server
        # that listens on the socket only, so a socket probe reports ready before the port
        # the tests connect to is open.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U lancache"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.94.0

      # No target-selecting flag, so this builds and runs the lib harness plus all 16 bin
      # harnesses. A `--lib` or name filter here would silently stop testing the bin targets.
      - name: Run Rust tests
        run: cargo test --no-fail-fast
        env:
          DATABASE_URL: postgres://lancache:lancache@127.0.0.1:5432/lancache
