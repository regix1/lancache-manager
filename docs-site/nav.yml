# Page order and titles for the documentation site.
#
# Each entry maps to docs-site/content/<file>.en.md and <file>.zh.md.
# docs-site/build.py validates that both language files exist for every entry
# and fails if one is missing, so a half-translated page cannot ship silently.
#
# To add a page: create both language files in content/, then add it here.

